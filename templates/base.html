<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI-Assisted IT Disaster Recovery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#F4F7FC;
            font-family:'Segoe UI',sans-serif;
        }

        /* Sidebar */

        .sidebar{

            position:fixed;

            left:0;
            top:0;

            width:250px;
            height:100vh;

            background:#111827;

            color:white;

            box-shadow:5px 0 20px rgba(0,0,0,.15);

        }

        .logo{

            padding:25px;

            text-align:center;

            border-bottom:1px solid rgba(255,255,255,.1);

        }

        .logo h3{

            font-weight:bold;

        }

        .menu{

            margin-top:25px;

        }

        .menu a{

            display:block;

            color:white;

            text-decoration:none;

            padding:15px 25px;

            transition:.3s;

            font-size:17px;

        }

        .menu a:hover{

            background:#2563EB;

            padding-left:35px;

        }

        .menu i{

            margin-right:12px;

        }

        /* Top Navbar */

        .topbar{

            position:fixed;

            left:250px;

            right:0;

            top:0;

            height:70px;

            background:white;

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:0 30px;

            box-shadow:0 2px 15px rgba(0,0,0,.08);

            z-index:100;

        }

        .page{

            margin-left:250px;

            margin-top:90px;

            padding:30px;

        }

        .card{

            border:none;

            border-radius:15px;

            transition:.3s;

        }

        .card:hover{

            transform:translateY(-5px);

            box-shadow:0 10px 25px rgba(0,0,0,.12);

        }

        .badge{

            font-size:13px;

        }

        table{

            border-radius:15px;

            overflow:hidden;

        }

    </style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <div class="logo">

        <h3>🛡 AI-DR</h3>

        <small>Secure Quarantine</small>

    </div>

    <div class="menu">

        <a href="/"><i class="bi bi-speedometer2"></i>Dashboard</a>

        <a href="/repository"><i class="bi bi-folder-fill"></i>Repository</a>

        <a href="/logs"><i class="bi bi-file-text-fill"></i>Logs</a>

        <a href="/analytics"><i class="bi bi-bar-chart-fill"></i>Analytics</a>

        <a href="/settings"><i class="bi bi-gear-fill"></i>Settings</a>

        <a href="/logout"><i class="bi bi-box-arrow-right"></i>Logout</a>

    </div>

</div>

<!-- Top Bar -->

<div class="topbar">

    <h4>AI-Assisted IT Disaster Recovery System</h4>

    <div>

        <i class="bi bi-bell-fill me-4"></i>

        <i class="bi bi-person-circle"></i>

        <strong>Administrator</strong>

    </div>

</div>
<!-- In base.html navbar add: -->

<a class="nav-link" href="/alerts">
    <i class="bi bi-bell-fill"></i>
    Alerts
    {% if active_alerts is defined
       and active_alerts > 0 %}
    <span class="badge bg-danger">
        {{ active_alerts }}
    </span>
    {% endif %}
</a>

<!-- Main Page -->

<div class="page">

{% block content %}

{% endblock %}

</div>

</body>

</html>
