<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI-Assisted IT Disaster Recovery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{

            background: linear-gradient(135deg,#0f172a,#1e3a8a);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, Helvetica, sans-serif;

        }

        .login-card{

            width:430px;
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 15px 40px rgba(0,0,0,.35);

        }

        .card-header{

            background:#0d6efd;
            color:white;
            text-align:center;
            padding:25px;

        }

        .logo{

            font-size:55px;

        }

        .system-title{

            font-weight:bold;
            font-size:22px;

        }

        .subtitle{

            font-size:14px;
            opacity:.9;

        }

        .card-body{

            padding:30px;

        }

        .form-control{

            height:48px;

        }

        .btn-login{

            height:48px;
            font-size:18px;
            font-weight:bold;

        }

        .footer{

            text-align:center;
            color:#6c757d;
            font-size:13px;
            margin-top:15px;

        }

    </style>

</head>

<body>

<div class="card login-card">

    <div class="card-header">

        <div class="logo">
            🛡
        </div>

        <div class="system-title">

            AI-Assisted IT Disaster Recovery

        </div>

        <div class="subtitle">

            Secure Quarantine Repository

        </div>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    <i class="bi bi-person-fill"></i>

                    Username

                </label>

                <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    <i class="bi bi-lock-fill"></i>

                    Password

                </label>

                <div class="input-group">

                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required>

                    <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="togglePassword()">

                        <i id="eye" class="bi bi-eye"></i>

                    </button>

                </div>

            </div>

            {% if error %}

            <div class="alert alert-danger">

                {{ error }}

            </div>

            {% endif %}

            <button
                    type="submit"
                    class="btn btn-primary w-100 btn-login">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>

        <div class="footer">

            KGEC Final Year Project <br>

            AI-Assisted IT Disaster Recovery System

        </div>

    </div>

</div>

<script>

function togglePassword(){

    let password=document.getElementById("password");

    let eye=document.getElementById("eye");

    if(password.type==="password"){

        password.type="text";

        eye.className="bi bi-eye-slash";

    }

    else{

        password.type="password";

        eye.className="bi bi-eye";

    }

}

</script>

</body>

</html>
